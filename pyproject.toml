[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-learning"
version = "0.1.0"
description = "LangChain + LangGraph 工业级项目学习脚手架"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastembed>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "capabilities*", "graphs*", "api*", "utils*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
